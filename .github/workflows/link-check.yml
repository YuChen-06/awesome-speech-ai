name: link-check

on:
  schedule:
    # Run monthly on the 1st at 07:17 UTC
    - cron: "17 7 1 * *"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    # Never block other workflows; link failures are advisory only
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --max-retries 3
            --max-connections 4
            --timeout 30
            --accept 200,204,301,302,403,429
            --exclude-path node_modules
            "**/*.md"
          # Ignore hosts that rate-limit or block automated crawlers
          # shields.io returns 403 to CI, arxiv.org rate-limits aggressively
          LYCHEE_EXCLUDE: "^(https?://(shields\\.io|img\\.shields\\.io|arxiv\\.org|doi\\.org|scholar\\.google\\.com|ieeexplore\\.ieee\\.org|openreview\\.net))"
          lycheeVersion: "v0.18.1"
          fail: false

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: ./lychee/out.md
          retention-days: 30
